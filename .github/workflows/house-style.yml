name: House style

# A reusable workflow: other repositories call it, pinned to a commit of
# method7/house-rules, with
#
#   jobs:
#     house-style:
#       uses: method7/house-rules/.github/workflows/house-style.yml@<commit>
#       with:
#         exclude: ":!:legacy-v1"
#
# It fails the build if any tracked file contains an em-dash (U+2014).
#
# The check script is inlined below rather than fetched. A called workflow
# cannot reliably tell which commit of this repository it was called at, so
# a second checkout of method7/house-rules would need the caller to repeat
# the commit in another input, and the two could drift apart. Inlined, the
# script is always the one from the commit the caller pinned. The copy is
# byte for byte scripts/check-house-style.sh: scripts/sync-workflow.sh
# writes it, and this repository's CI fails if the two differ.
#
# No secrets, no credentials, and a read-only token: it is safe to run on a
# pull request from anyone.

on:
  workflow_call:
    inputs:
      exclude:
        description: >-
          Exclude pathspecs, separated by spaces, for paths the check should
          skip, such as ":!:legacy-v1 :!:vendor". Leave empty to check every
          tracked file.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  house-style:
    name: No em-dashes (U+2014)
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, because callers pin this workflow to a commit and
      # a floating tag here would undo that. This is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check tracked files
        shell: sh
        # The input goes through an environment variable, never straight
        # into the script text, so a pathspec cannot inject a command.
        env:
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          script="$RUNNER_TEMP/check-house-style.sh"
          cat > "$script" <<'END_OF_HOUSE_RULES_SCRIPT'
          #!/bin/sh
          # check-house-style.sh: fail if any tracked file contains an em-dash (U+2014).
          #
          # Usage, from anywhere inside a git work tree:
          #
          #   sh check-house-style.sh [exclude-pathspec ...]
          #   sh check-house-style.sh ':!:legacy-v1' ':!:vendor'
          #
          # Only exclude pathspecs are accepted (':!:path', ':^path' or
          # ':(exclude)path'). Anything else would quietly narrow the check, so it is
          # refused.
          #
          # Why git grep and not grep: macOS grep has no -P, and a grep that fails to
          # run prints nothing, which looks exactly like a pass. git grep behaves the
          # same on every machine and only reads tracked files.
          #
          # Exit codes: 0 clean, 1 em-dashes found, 2 the check could not run.
          # Anything other than 0 must fail the build.
          #
          # This file is also copied, byte for byte, into
          # .github/workflows/house-style.yml. Edit it here, then run
          # scripts/sync-workflow.sh. The repository's own CI fails if the copies differ.

          set -u

          me=check-house-style

          root=$(git rev-parse --show-toplevel 2>/dev/null) || {
            echo "$me: not inside a git work tree, so nothing was checked." >&2
            exit 2
          }
          cd "$root" || exit 2

          for spec in "$@"; do
            case $spec in
              ':!'* | ':^'* | ':('*exclude*')'*) ;;
              *)
                echo "$me: '$spec' is not an exclude pathspec. Write it as ':!:$spec'." >&2
                exit 2
                ;;
            esac
          done

          # Without a UTF-8 locale, PCRE rejects \x{2014} and git exits 128. Set one so
          # the result does not depend on the machine.
          out=$(LC_ALL=C.UTF-8 git grep -nIP '\x{2014}' -- . "$@" 2>&1)
          status=$?

          case $status in
            0)
              count=$(printf '%s\n' "$out" | wc -l | tr -d ' ')
              echo "$me: found the em-dash (U+2014) on $count line(s):"
              echo
              printf '%s\n' "$out"
              echo
              echo "Method7 house style never uses U+2014. Replace each one with:"
              echo "  - a spaced en-dash (U+2013) for an aside"
              echo "  - otherwise a comma, colon or full stop"
              echo "  - an unspaced en-dash (U+2013) for a range: 2025–2026, Mon–Fri"
              exit 1
              ;;
            1)
              echo "$me: no em-dashes (U+2014) in tracked files."
              exit 0
              ;;
            *)
              echo "$me: the check could not run (git grep exited $status):" >&2
              printf '%s\n' "$out" >&2
              exit 2
              ;;
          esac
          END_OF_HOUSE_RULES_SCRIPT
          # Split the input on spaces, without expanding * or ? in a pathspec.
          set -f
          # shellcheck disable=SC2086
          sh "$script" $EXCLUDE
